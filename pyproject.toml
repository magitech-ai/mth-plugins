[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mth-plugins"
version = "0.1.0"
description = "Official portable plugins and marketplace catalog for Magitech Harness"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Magitech", email = "dev@magitech.ai" },
]
dependencies = [
    "magitech-harness",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mth_plugins"]

[tool.uv.sources]
anima = { path = "../anima", editable = true }
magitech-harness = { path = "../magitech-harness", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=src --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "ERA", "PL", "PERF", "RUF"
]
ignore = [
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "SIM105",  # try-except-pass vs suppress
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
