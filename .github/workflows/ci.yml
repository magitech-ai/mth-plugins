name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout anima dependency
        uses: actions/checkout@v4
        with:
          repository: magitech-ai/anima
          path: anima
          token: ${{ secrets.ORG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout magitech-harness dependency
        uses: actions/checkout@v4
        with:
          repository: magitech-ai/magitech-harness
          path: magitech-harness
          token: ${{ secrets.ORG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout mth-plugins
        uses: actions/checkout@v4
        with:
          path: mth-plugins

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: mth-plugins
        run: uv sync

      - name: Lint with ruff
        working-directory: mth-plugins
        run: uv run ruff check src tests

      - name: Check formatting with ruff
        working-directory: mth-plugins
        run: uv run ruff format --check src tests

      - name: Type check with mypy
        working-directory: mth-plugins
        run: uv run mypy src

      - name: Run tests with 100% coverage
        working-directory: mth-plugins
        run: uv run pytest
